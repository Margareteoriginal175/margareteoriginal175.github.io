name: Auto update site

on:
  schedule:
    # Primary: hourly (UTC minute 7)
    - cron: "7 * * * *"
    # Backup: every 2 hours offset (UTC minute 37)
    - cron: "37 */2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "build.py"
      - "fetch_auto.py"
      - "fetch_x.py"
      - "baidu_push.py"
      - "health_check.py"
      - "heartbeat.py"
      - "seo_config.json"
      - "fx.css"
      - "fx.js"
      - "vendor/**"
      - "cli/**"
      - "cli.sh"
      - "package.json"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot last good publish tree
        run: |
          set -e
          rm -rf .last_good
          mkdir -p .last_good
          # Preserve currently checked-out (last published) site artifacts
          for p in index.html 404.html feed.xml cli.sh fx.css fx.js robots.txt sitemap.xml sitemap.txt sitemap_index.xml netlify.toml; do
            [ -e "$p" ] && cp -a "$p" .last_good/ || true
          done
          for d in api m c item archives vendor data; do
            [ -d "$d" ] && cp -a "$d" .last_good/ || true
          done
          echo "[alive] snapshot ready"

      - name: Fetch X freebies (every 3h UTC, or manual)
        if: github.event_name != 'push'
        run: |
          set -e
          HOUR_UTC=$(date -u +%H)
          HOUR_UTC=$((10#$HOUR_UTC))
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ] || [ $((HOUR_UTC % 3)) -eq 0 ]; then
            echo "[x] fetch (event=$EVENT utc_hour=$HOUR_UTC cadence=3h)"
            set +e
            python3 fetch_x.py
            code=$?
            set -e
            if [ $code -ne 0 ]; then
              echo "[heal] fetch_x exited $code — continuing with previous data"
            fi
          else
            echo "[x] skip — reuse previous X data (event=$EVENT utc_hour=$HOUR_UTC; next at UTC hour%3==0)"
          fi
          exit 0

      - name: Fetch auto sources (self-healing)
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 fetch_auto.py
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "[heal] fetch_auto exited $code — continuing with previous data"
          fi
          exit 0

      - name: Build site (deep Baidu SEO)
        env:
          VERIFY_BAIDU: ${{ secrets.VERIFY_BAIDU }}
        run: python3 build.py

      - name: Health check (revert if broken)
        run: |
          set +e
          python3 health_check.py
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "[alive] health check failed — restoring last good build"
            if [ -d .last_good ]; then
              # Restore publishable artifacts; keep scripts/workflow intact
              for p in index.html 404.html feed.xml cli.sh fx.css fx.js robots.txt sitemap.xml sitemap.txt sitemap_index.xml; do
                [ -e ".last_good/$p" ] && cp -a ".last_good/$p" ./
              done
              for d in api m c item archives vendor; do
                if [ -d ".last_good/$d" ]; then
                  rm -rf "$d"
                  cp -a ".last_good/$d" ./
                fi
              done
              # Prefer previous day JSON under data/ if present in snapshot
              if [ -d .last_good/data ]; then
                mkdir -p data
                cp -a .last_good/data/. data/ || true
              fi
              echo "[alive] restored from .last_good"
              # Re-run check on restored tree (must pass, else abort publish)
              python3 health_check.py
            else
              echo "[alive] no snapshot — refusing to publish broken build"
              exit 1
            fi
          fi

      - name: Heartbeat keepalive (at most once/day)
        run: python3 heartbeat.py

      - name: Baidu URL push (optional)
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: python3 baidu_push.py

      - name: Commit and push (GitHub Pages)
        env:
          DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -e
          git config user.name "laohe-bot"
          git config user.email "9499758-wq@users.noreply.github.com"
          if [ -n "$DEPLOY_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          # never commit backup snapshot or pycache
          rm -rf .last_good
          git add -A
          git reset HEAD -- __pycache__ .last_good 2>/dev/null || true
          # Drop pure-noise paths if somehow empty; keep real data changes
          if git diff --cached --quiet; then
            echo "No changes — skip commit (hourly heartbeat suppressed)"
          else
            git commit -m "auto update $(TZ=Asia/Shanghai date '+%F %H:%M')"
            git push
          fi
